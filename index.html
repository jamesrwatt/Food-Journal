<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Journal</title>
<style>
  :root {
    color-scheme: light;
    --bg: #faf7f2;
    --green: #3a5a30;
    --brown: #b98d5e;
    --border: #ddd2bd;
    --text: #2b2b26;
    --muted: #7a6f5c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--bg); color: var(--text);
  }
  #app { height: 100vh; display: flex; flex-direction: column; }

  /* ---- Top bar ---- */
  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px; border-bottom: 2px solid var(--brown);
  }
  .topbar h1 { font-size: 1.4rem; color: var(--green); margin: 0; }
  .topbar input[type=text] {
    flex: 1; max-width: 320px; padding: 6px 10px; font-size: 0.9rem;
    border: 1px solid var(--border); border-radius: 6px; font-family: inherit;
  }
  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 6px;
    padding: 7px 14px; font-size: 0.85rem; background: var(--green); color: #fff;
  }
  button.secondary { background: #fff; color: var(--green); border: 1px solid var(--green); }
  button.brown { background: var(--brown); }

  /* ---- Board ---- */
  .board { flex: 1 1 auto; display: flex; gap: 14px; padding: 14px 20px; overflow: hidden; }
  .column { flex: 1; min-width: 0; display: flex; flex-direction: column; background: rgba(255,255,255,0.5); border: 1px solid var(--border); border-radius: 10px; }
  .column-head { padding: 8px 12px; font-weight: bold; color: var(--muted); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
  .column-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

  .rcard { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .rcard .rtitle { font-weight: bold; cursor: pointer; }
  .rcard .rtitle:hover { text-decoration: underline; }
  .rcard .rmeta { font-size: 0.75rem; color: var(--muted); margin: 4px 0; }
  .pill { display: inline-block; background: #eee0c8; color: var(--green); border-radius: 10px; padding: 1px 8px; font-size: 0.7rem; margin-right: 4px; }
  .rcard .ractions { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .rcard select { font-family: inherit; font-size: 0.75rem; padding: 2px; }

  /* Three shelves side by side needs width that a phone in portrait does not have: at
     375px each column is about 100px, leaving recipe titles in a 54px box. Below 600px
     the shelves stack full width and the board scrolls as one, so a title gets the whole
     screen. The recipe view itself is fine as it is and is left alone. */
  @media (max-width: 600px) {
    .board { flex-direction: column; overflow-y: auto; overflow-x: hidden; gap: 10px; padding: 10px 12px; }
    .column { flex: 0 0 auto; }
    .column-body { overflow-y: visible; min-height: 0; padding: 8px; }
    .topbar { flex-wrap: wrap; row-gap: 6px; }
    .topbar h1 { flex: 0 0 auto; }
    .topbar input[type="text"] { flex: 1 1 100%; order: 3; }
  }
  .no-photo-badge { font-size: 0.68rem; color: #8a5a2b; }

  /* ---- Detail (tablet card) view ---- */
  /* .detail is the single scroll container for this view: the bar, photo header,
     meta bar and content all scroll together rather than the grid scrolling
     inside a frozen frame. min-height:0 lets it actually overflow as a flex child. */
  .detail { flex: 1 1 auto; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; }
  .detail-bar { flex: 0 0 auto; padding: 8px 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--border); }
  /* Title band. The photo used to be a cover background on this element, which
     cropped it and stretched it across the full screen width; it now renders as a
     real image below, at its own aspect ratio. */
  .card-header {
    position: relative; flex: 0 0 auto;
    background: linear-gradient(135deg, #d9c7a3, #b98d5e);
    display: flex; align-items: flex-end; padding: clamp(12px,2.2vh,24px) clamp(16px,3vw,40px);
  }
  .photo-wrap { flex: 0 0 auto; padding: clamp(12px,2vh,18px) clamp(16px,3vw,40px) 0; }
  .recipe-photo {
    display: block; max-width: min(100%, 360px); max-height: 40vh;
    width: auto; height: auto; object-fit: contain;
    border-radius: 8px; border: 1px solid var(--border);
  }
  .card-header .title { position: relative; z-index: 1; font-size: clamp(1.3rem,3.2vh,2.1rem); font-weight: 700; color: var(--green); margin: 0; line-height: 1.1; }
  .photo-pending-badge { position: absolute; top: 10px; right: 14px; font-size: 0.7rem; background: rgba(255,255,255,0.9); padding: 3px 9px; border-radius: 10px; color: #8a5a2b; z-index: 1; }
  .meta-bar { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: clamp(10px,2vw,28px); padding: clamp(6px,1.4vh,14px) clamp(16px,3vw,40px); font-size: clamp(0.75rem,1.6vh,0.95rem); border-bottom: 1px solid var(--border); }
  .meta-bar b { color: var(--text); }
  .meta-bar .tags { margin-left: auto; font-style: italic; color: var(--muted); }
  .content-grid { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1.3fr; gap: clamp(14px,2.5vw,36px); padding: clamp(12px,2vh,22px) clamp(16px,3vw,40px); }
  .content-grid h2 { font-size: clamp(0.85rem,1.7vh,1.05rem); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 clamp(6px,1vh,10px); border-bottom: 2px solid var(--brown); padding-bottom: 4px; }
  .content-grid ul, .content-grid ol { margin: 0; padding-left: 1.1em; font-size: clamp(0.8rem,1.7vh,1rem); line-height: 1.5; }
  .content-grid ul { list-style: none; padding-left: 0; }
  .content-grid li { padding: 3px 0; }
  .content-grid ul li { border-bottom: 1px dotted var(--border); }

  .notes { font-size: clamp(0.8rem,1.7vh,1rem); line-height: 1.5; white-space: pre-wrap; color: var(--text); }

  /* ---- Full-screen photo viewer ---- */
  .recipe-photo { cursor: zoom-in; }
  .photoviewer {
    background: rgba(0,0,0,0.92); flex-direction: column; z-index: 60;
    /* The browser must not claim the gestures - pinch and drag are handled here. */
    touch-action: none; overflow: hidden; user-select: none;
  }
  .pvimg {
    max-width: 100vw; max-height: 100vh; object-fit: contain;
    transform-origin: 0 0; will-change: transform;
    -webkit-user-drag: none; user-select: none;
  }
  .pvclose {
    position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; z-index: 2;
    width: 44px; height: 44px; border-radius: 22px; font-size: 1.2rem; line-height: 1;
    background: rgba(255,255,255,0.9); color: var(--text); border: none; padding: 0;
  }
  .pvhint {
    position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,0.75); font-size: 0.8rem;
    pointer-events: none; transition: opacity 0.4s;
  }

  /* ---- URL import ---- */
  .importrow { display: flex; gap: 8px; align-items: center; }
  .importrow input { flex: 1 1 auto; margin: 0; }
  .importrow button { flex: 0 0 auto; }
  .importmsg { font-size: 0.8rem; color: var(--muted); margin-top: 6px; min-height: 1em; }
  .importmsg.err { color: #a8452f; }
  .importmsg.ok { color: var(--green); }
  .srcgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 14px; max-height: 46vh; overflow-y: auto; }
  .srcgrid img { width: 100%; height: 96px; object-fit: cover; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; background: #eee; }
  .srcgrid img:hover { border-color: var(--green); }
  .srcgrid img.busy { border-color: var(--green); opacity: 0.45; }
  /* Deliberately large: on a tablet this is a long-press target, not a text field. */
  .pastebox {
    margin-top: 12px; min-height: 78px; padding: 14px;
    border: 2px dashed var(--border); border-radius: 8px;
    color: var(--muted); font-size: 0.85rem; background: #fff;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .pastebox:focus { outline: none; border-color: var(--green); color: var(--text); }

  /* ---- Profiles ---- */
  .whogrid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .whobtn { font-size: 1rem; padding: 12px 20px; }

  /* ---- Sync status ---- */
  .sync { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .sync.online::before { content: "● "; color: #3a5a30; }
  .sync.connecting::before { content: "● "; color: #b98d5e; }
  .sync.offline::before { content: "● "; color: #a8452f; }

  /* ---- Add form ---- */
  .form-view { flex: 1 1 auto; overflow: auto; padding: 16px 24px; max-width: 700px; }
  .form-view label { display: block; font-size: 0.8rem; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .form-view input[type=text], .form-view textarea { width: 100%; padding: 8px; font-family: inherit; font-size: 0.9rem; border: 1px solid var(--border); border-radius: 6px; }
  .form-view textarea { min-height: 90px; }
  .tagbox { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .tagbox label { text-transform: none; font-size: 0.85rem; color: var(--text); margin: 0; display: flex; align-items: center; gap: 4px; }
  .row3 { display: flex; gap: 14px; }
  .row3 > div { flex: 1; }
  .hint { font-size: 0.78rem; color: var(--muted); background: #fff8ea; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-top: 10px; }

  /* ---- Modal ---- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 10px; padding: 22px 26px; max-width: 380px; text-align: center; }
  .modal h3 { margin-top: 0; color: var(--green); }
  .modal .opts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .grid10 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 14px; }
  .grid10 button.current { outline: 2px solid var(--green); outline-offset: 1px; font-weight: 700; }
  button.danger { background: #a8452f; border-color: #a8452f; color: #fff; }
  button.danger.secondary { background: transparent; color: #a8452f; border-color: #d8b6ad; }
  .grid10 button { background: #fff; color: var(--green); border: 1px solid var(--green); }
  .grid10 button:hover { background: var(--green); color: #fff; }
  .hidden { display: none !important; }
</style>
</head>

  function slugify(s) {
    return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  // ---- Profiles and shared state via Supabase ---------------------------------
  // A recipe is two things at once. Its text and its photo are facts about the dish, so
  // they are shared: one copy in `recipes`, last write wins. Which shelf it sits on and
  // what you scored it are opinions, so they belong to one person and live in
  // `profile_recipes` keyed by (profile, recipe). That split is why one person's 9/10 and
  // another's 6/10 can coexist, and why hiding a recipe costs nothing extra.
  //
  // In memory the two halves are merged back into one object per recipe, so the rendering
  // code never has to care. contentOf() splits them apart again on the way out.
  const SUPABASE_URL = 'https://uhicczuwqolnowonqwfq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_SlLvi4eVDROg3pEfiI1xfg_aUhr6I0u';
  const PHOTO_BUCKET = 'recipe-photos';
  const POLL_MS = 30000;
  const PROFILE_KEY = 'foodJournalProfile';
  const PROFILE_FIELDS = ['shelf', 'rating', 'hidden', 'nextPhotoPromptAt'];

  let profile = null;            // { id, name, isAdmin } — whose journal this device shows
  let allProfiles = [];
  let profilesAvailable = true;  // false drops back to the old single shared journal
  let cloudState = 'connecting'; // connecting | online | offline
  let pushTimer = null;

  // Shared recipe content is only ever pushed after a pull has succeeded in this session.
  // Before that, the in-memory list is whatever this build ships plus whatever the cache
  // held, and SEED_RECIPES carry image: null — so pushing it would blank the photo on
  // every recipe the server knows better than we do. Per-profile rows are exempt: they
  // are this profile's own and cannot clobber anybody's shared data.
  let contentReconciled = false;

  // Cached per profile, so switching people on one device does not show the previous
  // person's shelves for a moment before the pull lands.
  function cacheKey() {
    return profile ? STORAGE_KEY + ':' + profile.id : STORAGE_KEY;
  }

  function contentOf(r) {
    const out = {};
    Object.keys(r).forEach(k => { if (PROFILE_FIELDS.indexOf(k) < 0) out[k] = r[k]; });
    return out;
  }

  function load() {
    let list = [];
    try { list = JSON.parse(localStorage.getItem(cacheKey())) || []; } catch (e) { list = []; }
    // Recipes shipped with the build belong to whoever runs the family cookbook. A new
    // profile starts empty and fills up as recipes are sent to it.
    if (!profilesAvailable || !profile || profile.isAdmin) {
      SEED_RECIPES.forEach(seed => {
        if (!list.find(r => r.id === seed.id)) list.push(Object.assign({ hidden: false }, seed));
      });
    }
    return list;
  }

  function sbHeaders(extra) {
    return Object.assign({ apikey: SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }, extra || {});
  }
  function cloudLabel() {
    if (cloudState === 'online') return 'Synced';
    if (cloudState === 'connecting') return 'Connecting…';
    return 'Offline — saved on this device';
  }
  function setCloudState(next) {
    if (cloudState === next) return;
    cloudState = next;
    const el = document.getElementById('syncStatus');
    if (el) { el.textContent = cloudLabel(); el.className = 'sync ' + cloudState; }
  }

  function persistLocal(list) {
    try {
      localStorage.setItem(cacheKey(), JSON.stringify(list));
      return true;
    } catch (e) {
      alert("Couldn't save on this device — its storage for the journal is full. Replacing or removing a photo on an older recipe will free up room.");
      return false;
    }
  }

  // Every mutation in the app already funnels through save(), so this is the single
  // place that also has to tell the server. The push is debounced because a rating
  // and a shelf move can land back to back.
  function save(list) {
    const ok = persistLocal(list);
    clearTimeout(pushTimer);
    pushTimer = setTimeout(cloudPush, 400);
    return ok;
  }

  function upsert(table, rows, conflict) {
    if (!rows.length) return Promise.resolve(true);
    return fetch(SUPABASE_URL + '/rest/v1/' + table + '?on_conflict=' + conflict, {
      method: 'POST',
      headers: sbHeaders({ 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(rows)
    }).then(res => {
      if (!res.ok) throw new Error(table + ' push ' + res.status);
      return true;
    });
  }

  // Writes both halves: the shared recipe text and photo, and this profile's shelves and
  // ratings. Shelf and rating are deliberately NOT written into the shared row, or one
  // person moving a recipe would move it for everybody.
  function cloudPush() {
    // Shelf and rating are per person and live only in profile_recipes. They were also
    // mirrored onto the shared row while devices on the pre-profiles build still read
    // them from there; every device has since reloaded, so that duplicate is gone and
    // there is one place each fact lives.
    const content = recipes.map(r => ({ id: r.id, data: contentOf(r) }));
    const jobs = [];
    if (contentReconciled) jobs.push(upsert('recipes', content, 'id'));
    if (profilesAvailable && profile) {
      jobs.push(upsert('profile_recipes', recipes.map(r => ({
        profile_id: profile.id,
        recipe_id: r.id,
        shelf: r.shelf || 'To Make',
        rating: (typeof r.rating === 'number') ? r.rating : null,
        hidden: !!r.hidden,
        next_photo_prompt_at: (typeof r.nextPhotoPromptAt === 'number') ? r.nextPhotoPromptAt : null
      })), 'profile_id,recipe_id'));
    }
    return Promise.all(jobs)
      .then(() => { setCloudState('online'); return true; })
      .catch(() => { setCloudState('offline'); return false; });
  }

  // Asks the cleanup function to collect photos no live recipe references. Named objects
  // skip its "leave recent uploads alone" rule, which is how a photo belonging to a recipe
  // deleted seconds ago gets collected instead of waiting for the next sweep.
  function sweepPhotos(alsoDelete) {
    return fetch(SUPABASE_URL + '/functions/v1/cleanup-photos', {
      method: 'POST',
      headers: sbHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(alsoDelete && alsoDelete.length ? { alsoDelete: alsoDelete } : {})
    }).then(res => res.json()).catch(() => null);
  }

  function cloudPull() {
    // Nobody has said who they are yet, so there is no journal to sync into.
    if (profilesAvailable && !profile) return Promise.resolve();
    const jobs = [
      fetch(SUPABASE_URL + '/rest/v1/recipes?select=id,data', { headers: sbHeaders() })
        .then(res => { if (!res.ok) throw new Error('pull ' + res.status); return res.json(); })
    ];
    if (profilesAvailable && profile) {
      jobs.push(
        fetch(SUPABASE_URL + '/rest/v1/profile_recipes?select=*&profile_id=eq.' +
          encodeURIComponent(profile.id), { headers: sbHeaders() })
          .then(res => { if (!res.ok) throw new Error('state pull ' + res.status); return res.json(); })
      );
      // Refresh who exists. Without this, someone who adds themselves on their own tablet
      // never turns up in Send to... on anyone else's device until the page is reloaded.
      jobs.push(
        fetch(SUPABASE_URL + '/rest/v1/profiles?select=*&order=name', { headers: sbHeaders() })
          .then(res => (res.ok ? res.json() : null))
          .catch(() => null)
      );
    }

    return Promise.all(jobs)
      .then(results => {
        const rows = results[0];
        const states = results[1] || [];
        const people = results[2];
        setCloudState('online');
        if (people && people.length) {
          allProfiles = people.map(p => ({ id: p.id, name: p.name, isAdmin: !!p.is_admin }));
          // Take the server's word on our own name and admin flag in case they changed.
          const me = allProfiles.find(p => p.id === profile.id);
          if (me) { profile = me; rememberProfile(me); }
        }
        const byId = new Map(rows.map(x => [x.id, x.data]));
        const stateById = new Map(states.map(s => [s.recipe_id, s]));
        let changed = false;

        // Deleting a row outright cannot work: every client treats a recipe the server
        // lacks as one to upload, so the next sync from any device that still holds it
        // puts it straight back. A recipe is removed by keeping its row and flagging it
        // deleted — a tombstone the server can actually state, and clients can act on.
        const tombstoned = new Set(rows.filter(x => x.data && x.data.deleted).map(x => x.id));
        if (tombstoned.size) {
          const before = recipes.length;
          recipes = recipes.filter(r => !tombstoned.has(r.id));
          if (recipes.length !== before) changed = true;
        }

        // Merges the shared half with this profile's half. Falls back to whatever the
        // recipe already carries locally, which is what keeps an unsynced local change
        // from being wiped by a pull that has not seen it yet.
        // Falls back through: this profile's row, then whatever is already on the device,
        // then the legacy shelf and rating still carried on the shared row. That last step
        // matters during the transition — a recipe added after the migration has no
        // per-profile row yet, and defaulting it would silently move it back to To Make
        // and drop its rating rather than adopting the state it already had.
        const merge = (content, local) => {
          const s = stateById.get(content.id);
          const base = local || {};
          const num = (v) => (typeof v === 'number' ? v : null);
          return Object.assign({}, content, {
            shelf: s ? s.shelf : (base.shelf || content.shelf || 'To Make'),
            rating: s ? s.rating : (num(base.rating) !== null ? base.rating : num(content.rating)),
            hidden: s ? !!s.hidden : !!base.hidden,
            nextPhotoPromptAt: s ? s.next_photo_prompt_at : (base.nextPhotoPromptAt || null)
          });
        };

        // The server is the shared truth for anything it already knows about — except a
        // recipe deleted here whose tombstone has not reached the server yet. Taking the
        // server's copy would undo the deletion, and it would come back on the next render.
        recipes.forEach((r, i) => {
          if (r.deleted) return;
          const remote = byId.get(r.id);
          if (!remote) return;
          const merged = merge(remote, r);
          if (JSON.stringify(merged) !== JSON.stringify(r)) { recipes[i] = merged; changed = true; }
        });

        // Recipes that exist for this profile but are not on this device yet — added by
        // someone else, or sent to this profile from another one.
        rows.forEach(x => {
          if (x.data && x.data.deleted) return;
          if (recipes.some(r => r.id === x.id)) return;
          // With profiles on, a recipe only belongs to a profile once it has a row. The
          // admin is the exception: the shipped cookbook is theirs, so anything without a
          // row lands on their board and gets one on the next push.
          const mine = stateById.has(x.id) || !profilesAvailable || (profile && profile.isAdmin);
          if (!mine) return;
          recipes.push(merge(x.data, null));
          changed = true;
        });

        // Hidden is a per-profile removal: the recipe stays for everyone else.
        const beforeHide = recipes.length;
        recipes = recipes.filter(r => !r.hidden);
        if (recipes.length !== beforeHide) changed = true;

        // Everything in memory has now been reconciled against the server, so shared
        // content is safe to write back. Set before the push below, which needs it.
        contentReconciled = true;

        persistLocal(recipes);
        // Recipes this build ships that the server has not seen yet — a fresh deploy, the
        // first run against an empty table, or an admin recipe with no profile row.
        if (recipes.some(r => !byId.has(r.id) || (profilesAvailable && profile && !stateById.has(r.id)))) cloudPush();
        // Never yank the form or a live search out from under someone mid-typing.
        if (changed) syncRender();
        retryPendingPhotos();
      })
      .catch(() => setCloudState('offline'));
  }

  // Adding by id rather than pushing blindly. The server upserts on id, so a double-tap

  function rememberKnownProfile(p) {

    if (i >= 0) allProfiles[i] = p; else allProfiles.push(p);

      // Take the server's word on the name and admin flag, in case either changed.
      const fresh = allProfiles.find(p => p.id === saved.id);
      return fresh || (allProfiles.length ? null : saved);
    } catch (e) { return null; }

  // A photo taken with no signal is held locally as a data URL and uploaded on
  // reconnect, so it still reaches everyone else instead of being stranded.
  // The test is the data: prefix rather than the imagePendingUpload flag, because
  // photos taken before this sync landed predate the flag entirely: keying off it
  // would strand them as ~300 KB of base64 in the row, never reaching the bucket.
  function retryPendingPhotos() {
    recipes.filter(r => r.image && r.image.indexOf('data:') === 0).forEach(r => {
      fetch(r.image).then(res => res.blob())
        .then(blob => uploadPhoto(r.id, blob))
        .then(url => {
          r.image = url;
          r.imagePendingUpload = false;
          save(recipes);
          syncRender();
        })
        .catch(() => {});
    });
  }

  // capture="environment" makes a phone or tablet open the rear camera directly rather
  // than the photo library, which is the point of cooking with this thing in hand. It is
  // set per-click instead of living in the markup because while the attribute is present
  // some browsers drop the option to pick an already-taken shot, so each entry point asks
  // for the one it wants. Desktop browsers ignore it and just open a file dialog.
  function pickImage(input, useCamera) {
    if (useCamera) input.setAttribute('capture', 'environment');
    else input.removeAttribute('capture');
    input.click();
  }

  // Phone cameras produce 3-8 MB files, and base64 inflates them by a third, which
  // overruns the ~5 MB localStorage budget for the whole site on the first photo.
  // Downscale to a 1600px long edge and re-encode as JPEG before storing.
  const MAX_IMAGE_DIM = 1600;
  function readImageDownscaled(file, onDone, onError) {
    const reader = new FileReader();
    reader.onerror = () => onError("Couldn't read that file.");
    reader.onload = ev => {
      const img = new Image();
      img.onerror = () => onError("That file doesn't look like an image.");
      img.onload = () => {
        const scale = Math.min(1, MAX_IMAGE_DIM / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        canvas.toBlob(blob => {
          if (!blob) return onError("Couldn't process that image.");
          onDone({ blob: blob, dataUrl: dataUrl });
        }, 'image/jpeg', 0.82);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // Uploads the photo so everyone sees it, keeping it locally as a data URL if the
  // upload fails so it is not lost. Rolls the recipe back if even the local write is
  // rejected, so the view never shows a photo that did not persist anywhere.
  function applyPhoto(rec, shot, after, onFail) {
    // A sync landing while the dialog is open replaces objects in `recipes` wholesale, so
    // the one captured when the dialog opened can already be detached from the array.
    // Writing to that stale copy would save nothing. Re-resolve by id at commit time.
    const r = recipes.find(x => x.id === rec.id) || rec;
    const fail = (m) => { if (onFail) onFail(m); };
    const prev = {
      image: r.image, imageStatus: r.imageStatus,
      nextPhotoPromptAt: r.nextPhotoPromptAt, imagePendingUpload: r.imagePendingUpload
    };
    const commit = (value, pending) => {
      r.image = value;
      r.imagePendingUpload = pending;
      r.imageStatus = 'has-photo';
      r.nextPhotoPromptAt = null;
      if (!save(recipes)) {
        Object.assign(r, prev);
        fail("Couldn't save that photo on this device.");
        return;
      }
      after();
    };
    uploadPhoto(r.id, shot.blob)
      .then(url => { setCloudState('online'); commit(url, false); })
      .catch(() => { setCloudState('offline'); commit(shot.dataUrl, true); });
  }

  let recipes = load();
  // Carries what the importer found from the moment Import is pressed until Save, since
  // the source URL and its candidate photos are not editable form fields.
  let pendingImport = { source: '', images: [] };
  let view = { mode: 'board', recipeId: null, search: '' };

  function autoTag(text) {
    const lower = text.toLowerCase();
    let scores = {};
    Object.keys(TAG_KEYWORDS).forEach(tag => {
      scores[tag] = TAG_KEYWORDS[tag].reduce((n, kw) => n + (lower.includes(kw) ? 1 : 0), 0);
    });
    let best = Object.keys(scores).reduce((a, b) => scores[b] > scores[a] ? b : a);
    return scores[best] > 0 ? [best] : ['Main Dish'];
  }

  const app = document.getElementById('app');

  // Re-render triggered by a background sync rather than by the user. If they are
  // mid-search, redraw only the shelves so the focused input survives.
  function syncRender() {

    if (view.mode === 'board' && box && document.activeElement === box) renderShelves();
    else render();

  function render() {
    if (profilesAvailable && !profile) return renderProfilePicker();

    else if (view.mode === 'form') renderForm();

  // The top bar is rendered once and left alone; only the shelves below it are redrawn
  // as you type. Rebuilding the whole board on each keystroke replaced the very input
  // being typed into, which dropped focus after one letter — on a phone that closes the
  // keyboard, and on a desktop it means clicking back into the box for every character.
  function renderBoard() {
    app.innerHTML = `
      <div class="topbar">
        <h1>Food Journal</h1>
        <input type="text" id="searchBox" placeholder="Search by name or tag..." value="${escapeHtml(view.search)}">
        <span id="syncStatus" class="sync ${cloudState}">${cloudLabel()}</span>

  function renderShelves() {
    const shelves = ['To Make', 'Making', 'Made'];
    const q = view.search.toLowerCase();
    // Deleted and hidden recipes linger in the array until their push lands, so that the
    // flag actually reaches the server. Keep them off screen in the meantime.
    const filtered = recipes.filter(r =>
      !r.deleted && !r.hidden &&
      (!q || r.title.toLowerCase().includes(q) || r.tags.some(t => t.toLowerCase().includes(q)))
    );
    const cols = document.getElementById('boardCols');
    if (!cols) return;
    cols.innerHTML = shelves.map(shelf => {
      const items = filtered.filter(r => r.shelf === shelf);
      return `
        <div class="column">
          <div class="column-head">${shelf} (${items.length})</div>
          <div class="column-body">
            ${items.map(r => cardHtml(r)).join('') || '<div class="rmeta">No recipes here yet.</div>'}
          </div>
        </div>`;
    }).join('');
    recipes.forEach(r => {
      const t = document.getElementById('title-' + r.id);
      if (t) t.onclick = () => openRecipe(r.id);
      const sel = document.getElementById('shelf-' + r.id);
      if (sel) sel.onchange = e => moveShelf(r.id, e.target.value);
    });
  }

  function cardHtml(r) {
    const ratingBadge = r.rating != null ? `<span class="pill">${r.rating}/10</span>` : '';
    const photoBadge = r.imageStatus === 'has-photo' ? '' : `<div class="no-photo-badge">No final photo yet</div>`;
    return `
      <div class="rcard">
        <div class="rtitle" id="title-${r.id}">${escapeHtml(r.title)}</div>
        <div class="rmeta">${r.tags.map(t => `<span class="pill">${escapeHtml(t)}</span>`).join('')} ${ratingBadge}</div>

  function moveShelf(id, newShelf) {
    const r = recipes.find(x => x.id === id);
    if (!r) return;

      showRatingModal(r, () => { r.shelf = 'Made'; save(recipes); renderShelves(); });
      return;

  // Removing a recipe is a tombstone, not a row delete — see cloudPull for why deleting
  // the row just brings it back. The recipe stays in `recipes` carrying the flag so the
  // next push takes the tombstone with it; the board filters it out meanwhile, and once
  // the server has it the pull drops it from the array for good. That also means a delete
  // made offline still reaches everyone else on reconnect.
  function isAdmin() {
    return !profilesAvailable || !profile || profile.isAdmin;
  }

  // Non-admins hide: the row is theirs, so it never affects anyone else's journal.
  function hideRecipe(rec) {
    const r = recipes.find(x => x.id === rec.id) || rec;
    r.hidden = true;
    persistLocal(recipes);
    view.mode = 'board';
    render();
    // The recipe has to stay in the array until the push goes out, or the flag never
    // reaches the server and the next sync brings it straight back. The board already
    // filters hidden recipes, so it disappears immediately either way.
    clearTimeout(pushTimer);
    cloudPush().then(ok => {
      if (!ok) return;
      recipes = recipes.filter(x => x.id !== r.id);
      persistLocal(recipes);
    });
  }

  function deleteRecipe(rec) {
    if (!isAdmin()) return hideRecipe(rec);
    const r = recipes.find(x => x.id === rec.id) || rec;
    // Note the photo before tombstoning, so it can be named to the sweep afterwards.
    const photo = (typeof r.image === 'string' && r.image.indexOf('/storage/v1/object/public/') > 0)
      ? decodeURIComponent(r.image.split('/').pop().split('?')[0])
      : null;
    r.deleted = true;
    r.deletedAt = new Date().toISOString();
    persistLocal(recipes);
    view.mode = 'board';
    render();
    // Push the tombstone before sweeping. Until the server has it the recipe still counts
    // as live, its photo still looks in use, and the sweep would skip the very thing it
    // was called for. If the push fails there is nothing to clean up yet either.
    clearTimeout(pushTimer);
    cloudPush().then(ok => { if (ok) sweepPhotos(photo ? [photo] : []); });
  }

  // Full-screen photo viewer. Worth the pointer-event handling rather than leaning on the
  // browser: pinch-zoom on a page does not work usefully inside a fixed overlay, and the
  // point of this on a tablet is looking closely at a dish, not at the page around it.
  //
  // One transform drives everything — scale plus a translation — so pinch, double-tap and
  // wheel all just set those two values and clamp() keeps the image from being flung off
  // screen or shrunk below fit.
  function openPhotoViewer(src, alt) {
    const overlay = document.createElement('div');
    overlay.className = 'overlay photoviewer';
    overlay.innerHTML = `
      <button class="pvclose" id="pvClose" aria-label="Close photo">&#10005;</button>
      <img class="pvimg" id="pvImg" src="${escapeHtml(src)}" alt="${escapeHtml(alt || '')}">
      <div class="pvhint" id="pvHint">Pinch, double-tap or scroll to zoom</div>`;
    document.body.appendChild(overlay);

    const img = overlay.querySelector('#pvImg');
    const hint = overlay.querySelector('#pvHint');
    const MIN = 1, MAX = 5;
    let scale = 1, tx = 0, ty = 0;
    let base = null; // the image's un-zoomed rect, measured once it has laid out

    const apply = () => {
      img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      img.style.cursor = scale > 1 ? 'grab' : 'zoom-in';
    };

    // Keeps the image covering the viewport where it can, and centred where it cannot,
    // so panning never strands it in a corner with a void beside it.
    const clampPan = () => {
      if (!base) return;
      const w = base.width * scale, h = base.height * scale;
      const maxX = Math.max(0, (w - window.innerWidth) / 2);
      const maxY = Math.max(0, (h - window.innerHeight) / 2);
      tx = Math.min(maxX, Math.max(-maxX, tx));
      ty = Math.min(maxY, Math.max(-maxY, ty));
    };

    // Zooms about a point, so what is under the fingers stays under the fingers.
    const zoomTo = (next, cx, cy) => {
      if (!base) return;
      next = Math.min(MAX, Math.max(MIN, next));
      const centreX = base.left + base.width / 2 + tx;
      const centreY = base.top + base.height / 2 + ty;
      const k = next / scale;
      tx += (centreX - cx) * (k - 1);
      ty += (centreY - cy) * (k - 1);
      scale = next;
      if (scale === MIN) { tx = 0; ty = 0; }
      clampPan();
      apply();
    };

    const measure = () => {
      // Reset before measuring, or the transform is baked into the numbers.
      const t = img.style.transform;
      img.style.transform = '';
      base = img.getBoundingClientRect();
      img.style.transform = t;
    };
    if (img.complete) setTimeout(measure, 0); else img.onload = measure;
    window.addEventListener('resize', measure);

    const pointers = new Map();
    let pinchStart = 0, scaleStart = 1, panStart = null;
    // A gesture only counts as a tap if one finger went down and came up again without
    // travelling. Without this a pinch release registers as a tap, so the next tap is read
    // as a double-tap and throws away the zoom the pinch just set.
    let gestureMulti = false, gestureMoved = false, gestureStart = null;

    img.addEventListener('pointerdown', e => {
      img.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) {
        gestureMulti = false; gestureMoved = false;
        gestureStart = { x: e.clientX, y: e.clientY, t: Date.now() };
      }
      if (pointers.size === 2) {
        gestureMulti = true;
        const [a, b] = [...pointers.values()];
        pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
        scaleStart = scale;
      } else if (scale > 1) {
        panStart = { x: e.clientX - tx, y: e.clientY - ty };
      }
    });

    img.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchStart > 0) {
          zoomTo(scaleStart * (dist / pinchStart), (a.x + b.x) / 2, (a.y + b.y) / 2);
        }
      } else if (panStart && scale > 1) {
        tx = e.clientX - panStart.x;
        ty = e.clientY - panStart.y;
        clampPan();
        apply();
      }
      if (gestureStart && Math.hypot(e.clientX - gestureStart.x, e.clientY - gestureStart.y) > 10) {
        gestureMoved = true;
      }
    });

    const release = e => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchStart = 0;
      if (pointers.size === 0) panStart = null;
    };
    img.addEventListener('pointerup', release);
    img.addEventListener('pointercancel', release);

    // Double-tap and double-click both land here; toggling beats fiddling for a specific
    // zoom level when your hands are covered in flour.
    let lastTap = 0;
    img.addEventListener('pointerup', e => {
      const now = Date.now();
      const wasTap = !gestureMulti && !gestureMoved && pointers.size === 0
        && gestureStart && (now - gestureStart.t) < 400;
      if (!wasTap) { lastTap = 0; return; }
      if (now - lastTap < 300) {
        zoomTo(scale > 1 ? MIN : 2.5, e.clientX, e.clientY);
        lastTap = 0;
      } else {
        lastTap = now;
      }
    });

    overlay.addEventListener('wheel', e => {
      e.preventDefault();
      zoomTo(scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
    }, { passive: false });

    const close = () => {
      window.removeEventListener('resize', measure);
      document.removeEventListener('keydown', onKey);
      if (overlay.parentNode) document.body.removeChild(overlay);
    };
    const onKey = e => {
      if (e.key === 'Escape') close();
      if (e.key === '0') { scale = MIN; tx = 0; ty = 0; apply(); }
    };
    document.addEventListener('keydown', onKey);
    overlay.querySelector('#pvClose').onclick = close;
    // Tapping the backdrop closes, but only when not zoomed in — otherwise every pan that
    // ends off the image would dismiss the thing you are studying.
    overlay.addEventListener('click', e => { if (e.target === overlay && scale === MIN) close(); });

    setTimeout(() => { hint.style.opacity = '0'; }, 2600);
    return close;
  }

  // Copying an image straight off a web page beats saving it to the photo library and
  // hunting for it afterwards, which is the whole point on a tablet.
  //
  // This deliberately uses only the paste event. navigator.clipboard.read() promised a
  // one-tap version but never worked here: its permission prompt steals focus from the
  // document the call requires, so the call fails before the prompt is answered, and
  // once a prompt has been dismissed the browser refuses to ask again. A plain paste
  // needs no permission, no user activation and no focused element, and Ctrl+V and
  // right-click Paste both work today. Not worth carrying an API that only sometimes
  // helps for a job the platform already does properly.
  function fileFromPasteEvent(e) {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        const f = items[i].getAsFile();
        if (f) return f;
      }
    }
    return null;
  }

  function openPastePhotoModal(r, after) {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>Paste a photo</h3>
        <div>Copy an image from a web page, then press <b>Ctrl+V</b> — or right-click, or long-press on a tablet, and choose Paste.</div>
        <div id="pasteBox" class="pastebox" contenteditable="true" role="textbox"
             aria-label="Paste target">Ready to paste</div>
        <div id="pasteMsg" class="importmsg"></div>
        <div class="opts">
          <button class="secondary" id="pasteCancel">Cancel</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const msg = overlay.querySelector('#pasteMsg');
    let busy = false;

    // Catch the paste anywhere in the document while this dialog is open, not just inside
    // the box. Pressing Ctrl+V the moment the dialog appears is the obvious thing to do,
    // and it should not depend on having clicked the right element first. This path needs
    // no permission at all, which is why it is the one being made effortless.
    const onDocPaste = (e) => {
      const file = fileFromPasteEvent(e);
      if (!file) return;
      e.preventDefault();
      use(file);
    };
    document.addEventListener('paste', onDocPaste, true);
    const close = () => {
      document.removeEventListener('paste', onDocPaste, true);
      document.body.removeChild(overlay);
    };
    // Focused on open so a keyboard paste lands immediately.
    setTimeout(() => { const b = overlay.querySelector('#pasteBox'); if (b) b.focus(); }, 0);

    const use = (file) => {
      if (busy) return;
      busy = true;
      msg.className = 'importmsg';
      msg.textContent = 'Saving…';
      readImageDownscaled(file,
        shot => applyPhoto(r, shot, () => { close(); after(); }, m => { busy = false; msg.className = 'importmsg err'; msg.textContent = m; }),
        m => { busy = false; msg.className = 'importmsg err'; msg.textContent = m; });
    };

    overlay.querySelector('#pasteCancel').onclick = close;
    // A paste that carried no image still needs saying, and only the box can tell the
    // difference between "not an image" and "pasted somewhere else entirely".
    overlay.querySelector('#pasteBox').addEventListener('paste', e => {
      if (fileFromPasteEvent(e)) return; // the document-level handler takes it
      e.preventDefault();
      msg.className = 'importmsg err';
      msg.textContent = "That paste didn't contain an image. Copy the image itself rather than a link to it.";
    });
  }

  // For an imported recipe, offer the photos that were on the source page. The chosen one
  // is fetched through the edge function and re-uploaded to our own bucket rather than
  // hotlinked, so it keeps working if the source site changes or disappears.
  function openSourceImagePicker(r, after) {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>Photo from the recipe's page</h3>
        <div>Pick one and the journal will keep its own copy.</div>
        <div id="srcMsg" class="importmsg">Tap a photo to use it.</div>
        <div class="srcgrid">
          ${r.sourceImages.map((u, i) => `<img src="${escapeHtml(u)}" data-i="${i}" alt="Option ${i + 1}">`).join('')}
        </div>
        <div class="opts"><button class="secondary" id="srcCancel">Cancel</button></div>
      </div>`;
    document.body.appendChild(overlay);
    const close = () => document.body.removeChild(overlay);
    overlay.querySelector('#srcCancel').onclick = close;
    const msg = overlay.querySelector('#srcMsg');
    const thumbs = [...overlay.querySelectorAll('.srcgrid img')];
    let busy = false;
    const done = (text) => {
      busy = false;
      thumbs.forEach(t => t.classList.remove('busy'));
      msg.className = 'importmsg err';
      msg.textContent = text;
    };
    thumbs.forEach(thumb => {
      thumb.onclick = () => {
        // Without this, a second tap while the first is still fetching starts a competing
        // save, and there is nothing on screen saying the first one is running.
        if (busy) return;
        busy = true;
        thumbs.forEach(t => t.classList.toggle('busy', t === thumb));
        msg.className = 'importmsg';
        msg.textContent = 'Fetching that photo…';
        callImport({ url: r.sourceImages[+thumb.dataset.i], mode: 'image' })
          .catch(() => { throw new Error('Could not reach the importer — are you online?'); })
          .then(data => {
            if (!data || !data.ok) throw new Error((data && data.error) || 'Could not fetch that image.');
            return fetch(data.dataUrl).then(res => res.blob());
          })
          .then(blob => new Promise((resolve, reject) => {
            readImageDownscaled(
              new File([blob], 'source.jpg', { type: blob.type || 'image/jpeg' }),
              resolve,
              m => reject(new Error(m))
            );
          }))
          .then(shot => new Promise((resolve, reject) => {
            msg.textContent = 'Saving…';
            applyPhoto(r, shot, resolve, m => reject(new Error(m)));
          }))
          .then(() => { close(); after(); })
          // Every step above can reject. Without this the dialog just sat there with no
          // explanation, which is exactly what it looked like when a step failed.
          .catch(err => done(err && err.message ? err.message : 'That photo could not be saved.'));
      };
    });
  }

  function openChangePhotoModal(r) {
    const hasPhoto = r.imageStatus === 'has-photo';
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>${hasPhoto ? 'Replace Photo' : 'Add a Photo'}</h3>
        <div>${hasPhoto ? 'Take or choose a new photo to replace the current one.' : 'Take a photo of this dish, or choose one you already have.'}</div>
        <div class="opts">
          <button id="changePhotoTake">Take Photo</button>
          <button id="changePhotoChoose">Choose Existing</button>
          <button id="changePhotoPaste">Paste Photo</button>
          ${r.sourceImages && r.sourceImages.length ? `<button id="changePhotoSource">From Recipe's Page</button>` : ''}
          <button id="changePhotoCancel" class="secondary">Cancel</button>
        </div>
        <input type="file" id="changePhotoFile" accept="image/*" class="hidden" style="margin-top:10px;">
      </div>`;
    document.body.appendChild(overlay);
    const close = () => document.body.removeChild(overlay);
    document.getElementById('changePhotoTake').onclick = () => pickImage(document.getElementById('changePhotoFile'), true);
    document.getElementById('changePhotoChoose').onclick = () => pickImage(document.getElementById('changePhotoFile'), false);
    document.getElementById('changePhotoPaste').onclick = () => { close(); openPastePhotoModal(r, () => renderDetail()); };
    const srcBtn = document.getElementById('changePhotoSource');
    if (srcBtn) srcBtn.onclick = () => { close(); openSourceImagePicker(r, () => renderDetail()); };
    document.getElementById('changePhotoFile').onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      readImageDownscaled(file, shot => {
        applyPhoto(r, shot, () => { close(); renderDetail(); }, m => alert(m));
      }, msg => alert(msg));
    };
    document.getElementById('changePhotoCancel').onclick = () => close();
  }

  function renderDetail() {
    const r = recipes.find(x => x.id === view.recipeId);
    // Also bounce if it was deleted on another device, or hidden from this journal,
    // while it was open.
    if (!r || r.deleted || r.hidden) { view.mode = 'board'; return render(); }

    const photoBadge = r.imageStatus === 'has-photo' ? '' :
      `<span class="photo-pending-badge">${r.imageStatus === 'ai-pending' ? 'Photo pending (AI gen not connected)' : 'Photo pending'}</span>`;
    const photoBlock = r.imageStatus === 'has-photo' && r.image
      ? `<div class="photo-wrap"><img class="recipe-photo" src="${escapeHtml(r.image)}" alt="${escapeHtml(r.title)}"
           role="button" tabindex="0" title="Tap to view full screen"></div>`
      : '';

    app.innerHTML = `
      <div class="detail">
        <div class="detail-bar">
          <button class="secondary" id="backBtn">&larr; Board</button>
          <span style="color:var(--muted); font-size:0.85rem;">Shelf: <b>${r.shelf}</b></span>
          <button class="secondary" id="rateBtn">${r.rating != null ? `Rating: ${r.rating}/10 &middot; Update` : 'Add Rating'}</button>
          <button class="secondary" id="editBtn" style="margin-left:auto;">Edit</button>
          <button class="secondary" id="changePhotoBtn">${r.imageStatus === 'has-photo' ? 'Replace Photo' : 'Change Photo'}</button>
          ${profilesAvailable && allProfiles.length > 1 ? `<button class="secondary" id="sendBtn">Send to…</button>` : ''}
          <button class="secondary danger" id="deleteBtn">${isAdmin() ? 'Delete' : 'Remove'}</button>
        </div>
        <div class="card-header">
          ${photoBadge}
          <p class="title">${escapeHtml(r.title)}</p>
        </div>
        ${photoBlock}
        <div class="meta-bar">
          ${r.oven ? `<span><b>Oven:</b> ${escapeHtml(r.oven)}</span>` : ''}
          ${r.bakeTime ? `<span><b>Bake Time:</b> ${escapeHtml(r.bakeTime)}</span>` : ''}
          ${r.prepTime ? `<span><b>Prep Time:</b> ${escapeHtml(r.prepTime)}</span>` : ''}
          ${r.servings ? `<span><b>Serves:</b> ${escapeHtml(r.servings)}</span>` : ''}
          <span class="tags">${r.tags.join(', ')}</span>
        </div>
        <div class="content-grid">
          <div class="col">
            <h2>Ingredients</h2>
            <ul>${r.ingredients.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>
          </div>
          <div class="col">
            <h2>Instructions</h2>
            <ol>${r.instructions.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ol>
            ${r.notes ? `<h2 style="margin-top:18px;">Notes</h2><div class="notes">${escapeHtml(r.notes)}</div>` : ''}
          </div>
        </div>
      </div>`;

    document.getElementById('backBtn').onclick = () => { view.mode = 'board'; render(); };
    document.getElementById('rateBtn').onclick = () => showRatingModal(r, () => renderDetail());
    document.getElementById('deleteBtn').onclick = () => confirmDeleteModal(r);
    document.getElementById('editBtn').onclick = () => { view.mode = 'form'; view.editId = r.id; render(); };
    const photoEl = app.querySelector('.recipe-photo');
    if (photoEl) {
      const openIt = () => openPhotoViewer(r.image, r.title);
      photoEl.onclick = openIt;
      photoEl.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openIt(); } };
    }
    const sendBtn = document.getElementById('sendBtn');
    if (sendBtn) sendBtn.onclick = () => showSendModal(r);
    document.getElementById('changePhotoBtn').onclick = () => openChangePhotoModal(r);
    maybeShowPhotoPrompt(r);
  }

  function renderForm() {
    pendingImport = { source: '', images: [] };
    // view.editId set means this is an edit of an existing recipe rather than a new one.
    const editing = view.editId ? recipes.find(r => r.id === view.editId) : null;
    if (view.editId && !editing) { view.mode = 'board'; view.editId = null; return render(); }
    const val = (v) => escapeHtml(v || '');
    app.innerHTML = `
      <div class="topbar">
        <button class="secondary" id="cancelBtn">&larr; ${editing ? 'Back' : 'Board'}</button>
        <h1>${editing ? 'Edit Recipe' : 'Add a Recipe'}</h1>
      </div>
      <div class="form-view">
        ${editing ? `
        <div class="hint">
          Changes here are to the recipe itself, so everyone sees them. Shelf and rating
          stay yours.
        </div>` : `
        <div class="hint">
          Paste a recipe link below to fill this in automatically, or just type it out.
          For a screenshot or a handwritten card, send it to Claude in chat instead.
        </div>
        <label>Import from a link</label>
        <div class="importrow">
          <input type="url" id="f_url" placeholder="https://... paste a recipe page">
          <button class="secondary" id="importBtn">Import</button>
        </div>
        <div id="importMsg" class="importmsg"></div>`}
        <label>Title</label>
        <input type="text" id="f_title" placeholder="e.g. Goose's Chocolate Chip Cookies" value="${val(editing && editing.title)}">
        <div class="row3">
          <div><label>Oven</label><input type="text" id="f_oven" placeholder="350°F" value="${val(editing && editing.oven)}"></div>
          <div><label>Bake Time</label><input type="text" id="f_bake" placeholder="10-12 min" value="${val(editing && editing.bakeTime)}"></div>
          <div><label>Prep Time</label><input type="text" id="f_prep" placeholder="15 min" value="${val(editing && editing.prepTime)}"></div>
        </div>
        <label>Servings</label>
        <input type="text" id="f_servings" placeholder="e.g. 4" value="${val(editing && editing.servings)}">
        <label>Ingredients (one per line)</label>
        <textarea id="f_ingredients" placeholder="1 cup flour&#10;2 eggs&#10;...">${val(editing && editing.ingredients ? editing.ingredients.join('\n') : '')}</textarea>
        <label>Instructions (one step per line)</label>
        <textarea id="f_instructions" placeholder="Preheat oven...&#10;Mix ingredients...&#10;...">${val(editing && editing.instructions ? editing.instructions.join('\n') : '')}</textarea>
        <label>Notes</label>
        <textarea id="f_notes" placeholder="What you served it with, what you'd change next time...">${val(editing && editing.notes)}</textarea>
        <label>Tags <button class="secondary" id="autoTagBtn" style="font-size:0.7rem; padding:3px 8px;">Auto-tag</button></label>
        <div class="tagbox">
          ${['Appetizer','Main Dish','Side','Dessert'].map(t =>
            `<label><input type="checkbox" value="${t}" class="tagChk"${editing && editing.tags && editing.tags.indexOf(t) >= 0 ? ' checked' : ''}> ${t}</label>`).join('')}
        </div>
        <div style="margin-top:18px;">
          <button id="saveBtn">${editing ? 'Save Changes' : 'Save Recipe'}</button>
        </div>
      </div>`;

    document.getElementById('cancelBtn').onclick = () => {
      // Editing came from the recipe, so go back there rather than all the way out.
      if (view.editId) { view.mode = 'detail'; view.recipeId = view.editId; view.editId = null; }
      else view.mode = 'board';
      render();
    };
    // The import row only exists when adding; editing an existing recipe has no use for it.
    if (document.getElementById('importBtn')) document.getElementById('importBtn').onclick = (e) => {
      e.preventDefault();
      const url = document.getElementById('f_url').value.trim();
      const msg = document.getElementById('importMsg');
      const btn = document.getElementById('importBtn');
      if (!url) { msg.className = 'importmsg err'; msg.textContent = 'Paste a recipe link first.'; return; }
      btn.disabled = true; btn.textContent = 'Importing…';
      msg.className = 'importmsg'; msg.textContent = 'Reading the page…';
      callImport({ url })
        .catch(() => ({ ok: false, error: 'Could not reach the importer — are you online?' }))
        .then(data => {
          btn.disabled = false; btn.textContent = 'Import';
          if (!data || !data.ok) {
            msg.className = 'importmsg err';
            msg.textContent = (data && data.error) || 'Import failed.';
            return;
          }
          const setIf = (id, v) => { if (v) document.getElementById(id).value = v; };
          setIf('f_title', data.title);
          setIf('f_oven', data.oven);
          setIf('f_bake', data.bakeTime);
          setIf('f_prep', data.prepTime);
          setIf('f_servings', data.servings);
          const ing = data.ingredients || [], steps = data.instructions || [];
          if (ing.length) document.getElementById('f_ingredients').value = ing.join('\n');
          if (steps.length) document.getElementById('f_instructions').value = steps.join('\n');
          const tags = autoTag([data.title, ing.join(' '), steps.join(' ')].join(' '));
          document.querySelectorAll('.tagChk').forEach(chk => { chk.checked = tags.includes(chk.value); });
          pendingImport = { source: data.source || url, images: data.images || [] };
          const shots = pendingImport.images.length;
          // A prose-parsed page had no structured recipe data, so this is a best guess
          // read off the article text and is worth a closer look before saving.
          const guessed = data.parsedFrom === 'prose';
          msg.className = 'importmsg ok';
          msg.textContent = (guessed
            ? `That page has no recipe data, so this is a best guess from the article — read it over carefully. Got ${ing.length} ingredients and ${steps.length} steps.`
            : `Imported ${ing.length} ingredients and ${steps.length} steps — check it over, then save.`)
            + (shots ? ` Found ${shots} photo${shots > 1 ? 's' : ''} on the page; you can pick one after saving.` : '');
        });
    };
    document.getElementById('autoTagBtn').onclick = (e) => {
      e.preventDefault();
      const text = [
        document.getElementById('f_title').value,
        document.getElementById('f_ingredients').value,
        document.getElementById('f_instructions').value
      ].join(' ');
      const tags = autoTag(text);
      document.querySelectorAll('.tagChk').forEach(chk => { chk.checked = tags.includes(chk.value); });
    };
    document.getElementById('saveBtn').onclick = () => {
      const title = document.getElementById('f_title').value.trim();
      if (!title) { alert('Please enter a title.'); return; }
      const tags = Array.from(document.querySelectorAll('.tagChk:checked')).map(c => c.value);
      const fields = {
        title: title,
        oven: document.getElementById('f_oven').value.trim(),
        bakeTime: document.getElementById('f_bake').value.trim(),
        prepTime: document.getElementById('f_prep').value.trim(),
        servings: document.getElementById('f_servings').value.trim(),
        ingredients: document.getElementById('f_ingredients').value.split('\n').map(s => s.trim()).filter(Boolean),
        instructions: document.getElementById('f_instructions').value.split('\n').map(s => s.trim()).filter(Boolean),
        notes: document.getElementById('f_notes').value.trim(),
        tags: tags.length ? tags : autoTag(title)
      };

      if (editing) {
        // Assign onto the existing recipe rather than replacing it, so everything the
        // form does not cover — the photo, where it came from, the shelf, the rating,
        // the date it was added — survives an edit untouched. The id never changes
        // either, or the per-profile rows and the photo would lose their recipe.
        const live = recipes.find(r => r.id === editing.id) || editing;
        Object.assign(live, fields);
        save(recipes);
        view.mode = 'detail';
        view.recipeId = live.id;
        view.editId = null;
        render();
        return;
      }

      let id = slugify(title);
      if (recipes.find(r => r.id === id)) id = id + '-' + Date.now();
      const rec = Object.assign({ id: id }, fields, {
        shelf: 'To Make',
        rating: null,
        image: null,
        imageStatus: 'pending',
        nextPhotoPromptAt: null,
        dateAdded: new Date().toISOString().slice(0, 10)
      });
      if (pendingImport.source) rec.source = pendingImport.source;
      if (pendingImport.images.length) rec.sourceImages = pendingImport.images;
      pendingImport = { source: '', images: [] };
      recipes.push(rec);
      save(recipes);
      view.mode = 'board';
      render();
    };
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Ask the server who exists before drawing anything, so the picker is real rather than
  // a guess. If that fails the app falls back to the single shared journal it had before
  // profiles, which means a bad deploy or an unreachable table degrades instead of
  // showing an empty kitchen.
  loadProfiles().then(() => {
    if (profilesAvailable) {
      profile = recallProfile();
      if (profile) rememberProfile(profile);
    }
    recipes = load();
    render();
    cloudPull();
  });

  setInterval(cloudPull, POLL_MS);
  window.addEventListener('focus', cloudPull);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) cloudPull(); });
  window.addEventListener('online', cloudPull);
})();
</script>
</body>
</html>
