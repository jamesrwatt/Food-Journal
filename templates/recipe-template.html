<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: #faf7f2;
    color: #2b2b26;
  }
  .card {
    height: 100vh;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: auto; /* fallback: scroll rather than shrink text past readable size */
  }
  .header {
    position: relative;
    flex: 0 0 26vh;
    min-height: 140px;
    background: linear-gradient(135deg, #d9c7a3, #b98d5e);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: flex-end;
    padding: clamp(10px, 2vh, 22px) clamp(16px, 3vw, 40px);
  }
  .header.has-photo { background-image: url('{{IMAGE_URL}}'); }
  .header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 40%;
    background: linear-gradient(to top, rgba(250,247,242,0.95), rgba(250,247,242,0));
  }
  .header-text { position: relative; z-index: 1; }
  .title {
    font-size: clamp(1.3rem, 3.2vh, 2.1rem);
    font-weight: 700;
    color: #3a5a30;
    margin: 0;
    line-height: 1.1;
  }
  .meta-bar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: clamp(10px, 2vw, 28px);
    padding: clamp(6px, 1.4vh, 14px) clamp(16px, 3vw, 40px);
    font-size: clamp(0.75rem, 1.6vh, 0.95rem);
    border-bottom: 1px solid #ddd2bd;
  }
  .meta-bar b { color: #2b2b26; }
  .tags { margin-left: auto; font-style: italic; color: #7a6f5c; }
  .content {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: clamp(14px, 2.5vw, 36px);
    padding: clamp(12px, 2vh, 22px) clamp(16px, 3vw, 40px);
    overflow: auto;
    min-height: 0; /* allow grid children to shrink/scroll instead of pushing page taller */
  }
  .col h2 {
    font-size: clamp(0.85rem, 1.7vh, 1.05rem);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #7a6f5c;
    margin: 0 0 clamp(6px, 1vh, 10px) 0;
    border-bottom: 2px solid #b98d5e;
    padding-bottom: 4px;
  }
  .ingredients ul {
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: clamp(0.8rem, 1.7vh, 1rem);
    line-height: 1.5;
  }
  .ingredients li {
    padding: 3px 0;
    border-bottom: 1px dotted #ddd2bd;
  }
  .instructions ol {
    margin: 0;
    padding-left: 1.2em;
    font-size: clamp(0.8rem, 1.7vh, 1rem);
    line-height: 1.5;
  }
  .instructions li { padding: 3px 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="header {{HEADER_CLASS}}">
      <div class="header-text">
        <p class="title">{{TITLE}}</p>
      </div>
    </div>
    <div class="meta-bar">
      <span><b>Oven:</b> {{OVEN}}</span>
      <span><b>Bake Time:</b> {{BAKE_TIME}}</span>
      <span><b>Prep Time:</b> {{PREP_TIME}}</span>
      <span><b>Serves:</b> {{SERVES}}</span>
      <span class="tags">{{TAGS}}</span>
    </div>
    <div class="content">
      <div class="col ingredients">
        <h2>Ingredients</h2>
        <ul>
          {{INGREDIENTS_LI}}
        </ul>
      </div>
      <div class="col instructions">
        <h2>Instructions</h2>
        <ol>
          {{INSTRUCTIONS_LI}}
        </ol>
      </div>
    </div>
  </div>
</body>
</html>
